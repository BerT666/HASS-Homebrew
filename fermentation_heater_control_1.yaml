blueprint:
  name: Fermentation Chamber - Heater Control
  description: >
    Keeps a fermentation chamber (e.g. a converted fridge used as a
    brewing / wine / mead fermentation cabinet) above a target
    temperature by switching a heating actuator (heat belt, aquarium
    heater, etc.) on and off around an `input_number` target, with
    hysteresis to avoid short-cycling and a periodic backup check in
    case a state-change event is ever missed.

    Originally built around a RAPT Pill / Tilt hydrometer's
    temperature reading, but works with any temperature sensor
    entity. Pair with the matching "Fermentation Chamber - Cooler
    Control" and "Fermentation Chamber - Sensor Watchdog" blueprints
    for full two-way temperature control with a sensor fail-safe.
  domain: automation
  author: BerT
  source_url: https://github.com/BerT666/HASS-Homebrew/blob/main/fermentation_heater_control.yaml
  homeassistant:
    min_version: "2024.10.0"
  input:
    entities:
      name: Entities
      icon: mdi:thermometer
      input:
        temperature_sensor:
          name: Temperature sensor
          description: Sensor reporting the current fermentation temperature.
          selector:
            entity:
              domain: sensor
              device_class: temperature
        target_temperature:
          name: Target temperature helper
          description: >-
            An input_number helper holding the desired fermentation
            temperature (same unit as the sensor).
          selector:
            entity:
              domain: input_number
        fermentation_active:
          name: '"Fermentation active" toggle'
          description: >-
            An input_boolean helper that must be on for this
            automation to act. Turn it off between batches so the
            heater never turns on with an empty chamber.
          selector:
            entity:
              domain: input_boolean
        heater_switch:
          name: Heater switch
          description: The switch controlling the heating actuator.
          selector:
            entity:
              domain: switch
        cooler_switches:
          name: Cooler switch(es) (optional)
          description: >-
            If the chamber is also actively cooled, select the
            cooler switch(es) here so the heater never turns on
            while cooling is running.
          default: []
          selector:
            entity:
              domain: switch
              multiple: true
    settings:
      name: Settings
      icon: mdi:cog
      collapsed: true
      input:
        turn_on_offset:
          name: Turn-on offset
          description: >-
            How far below the target temperature the reading must
            fall before the heater switches on.
          default: 0.2
          selector:
            number:
              min: 0
              max: 5
              step: 0.01
              unit_of_measurement: "°"
              mode: box
        turn_off_offset:
          name: Turn-off offset
          description: >-
            How close to the target (from below) the reading must
            recover before the heater switches off again. Keep this
            smaller than the turn-on offset.
          default: 0.05
          selector:
            number:
              min: 0
              max: 5
              step: 0.01
              unit_of_measurement: "°"
              mode: box
        backup_check_interval:
          name: Backup check interval
          description: >-
            Safety-net re-evaluation interval, in case a
            sensor-update event is ever missed.
          default: 5
          selector:
            number:
              min: 1
              max: 60
              unit_of_measurement: min
              mode: box

mode: single
max_exceeded: silent

variables:
  temperature_sensor: !input temperature_sensor
  target_temperature: !input target_temperature
  cooler_switches: !input cooler_switches
  turn_on_offset: !input turn_on_offset
  turn_off_offset: !input turn_off_offset

triggers:
  - trigger: numeric_state
    entity_id: !input temperature_sensor
    below: !input target_temperature
  - trigger: numeric_state
    entity_id: !input temperature_sensor
    above: !input target_temperature
  - trigger: time_pattern
    minutes: !input backup_check_interval

conditions:
  - condition: state
    entity_id: !input fermentation_active
    state: "on"

actions:
  - choose:
      - conditions:
          - condition: template
            value_template: >-
              {{ states(temperature_sensor) | float(0) <
                 states(target_temperature) | float(0) - turn_on_offset | float(0) }}
          - condition: state
            entity_id: !input heater_switch
            state: "off"
          - condition: template
            value_template: >-
              {{ expand(cooler_switches) | selectattr('state', 'eq', 'on')
                 | list | length == 0 }}
        sequence:
          - action: switch.turn_on
            target:
              entity_id: !input heater_switch
      - conditions:
          - condition: template
            value_template: >-
              {{ states(temperature_sensor) | float(0) >=
                 states(target_temperature) | float(0) - turn_off_offset | float(0) }}
          - condition: state
            entity_id: !input heater_switch
            state: "on"
        sequence:
          - action: switch.turn_off
            target:
              entity_id: !input heater_switch
